name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: xcode-27
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verify toolchain
        run: bash Scripts/check-toolchain.sh
      - name: quality checks
        run: bash Scripts/quality.sh

  tests:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verify toolchain
        run: bash Scripts/check-toolchain.sh
      - name: build app and test bundles once
        run: bash Scripts/build-tests.sh
      - name: unit and integration tests
        run: bash Scripts/test-unit.sh --no-build
      - name: deterministic UI acceptance
        run: bash Scripts/test-ui.sh --no-build
      - name: upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gifferent-ci-failure-${{ github.run_id }}
          path: |
            .build/ci/*/*.log
            .build/ci/*/*.xcresult/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
